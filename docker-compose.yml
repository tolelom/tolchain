services:
  tolchain:
    image: ghcr.io/tolelom/tolchain:latest
    container_name: tolchain-node
    restart: unless-stopped
    env_file: .env
    ports:
      - "8545:8545"
      - "30303:30303"
    volumes:
      - ./data:/home/tol/data
      - ./config.json:/home/tol/config.json:ro
      - ./validator.key:/home/tol/validator.key:ro
    command: ["--config", "config.json", "--key", "validator.key"]

  prometheus:
    image: prom/prometheus:latest
    container_name: tolchain-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - tolchain

  grafana:
    image: grafana/grafana:latest
    container_name: tolchain-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
