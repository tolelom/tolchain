name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 1. 정적 분석 + 테스트 + 커버리지 ─────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go.mod 정리 확인
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      # 패키지 단위 테스트(consensus, storage, 모듈 등)도 모두 돌린다. 이전에는 ./tests/ 만 돌았다.
      - name: Test(-race) + 커버리지 측정
        run: |
          go test -race ./... -coverprofile=coverage.out -coverpkg=./...
          go tool cover -func=coverage.out | tail -1

      - name: 커버리지 게이트 (최소 50%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 50" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below the 50% minimum threshold"
            exit 1
          fi

      - name: 벤치마크
        run: go test ./tests/ -bench=. -benchmem -benchtime=1s -count=1 -run=^$ | tee benchmark.txt

      - name: 결과 업로드
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            coverage.out
            benchmark.txt

  # ── 2. Docker 빌드 & GHCR 푸시 (main 머지 시만) ───────────────────────────
  docker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tolchain:latest
            ghcr.io/${{ github.repository_owner }}/tolchain:main
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
