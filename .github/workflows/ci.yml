name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 1. 정적 분석 + 테스트 + 커버리지 ─────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test + 커버리지 측정
        run: |
          go test ./tests/ -coverprofile=coverage.out -coverpkg=./...
          go tool cover -func=coverage.out | tail -1

      - name: 커버리지 게이트 (최소 50%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 50" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below the 50% minimum threshold"
            exit 1
          fi

      - name: 벤치마크
        run: go test ./tests/ -bench=. -benchmem -benchtime=1s -count=1 -run=^$ | tee benchmark.txt

      - name: 결과 업로드
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage.out
            benchmark.txt

  # ── 2. Docker 빌드 & GHCR 푸시 (main 머지 시만) ───────────────────────────
  docker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tolchain:latest
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. 서버 배포 (Docker 푸시 완료 후) ────────────────────────────────────
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export PATH=$PATH:/usr/local/bin:/opt/homebrew/bin:$HOME/.docker/bin
            cd ~/server
            docker compose pull tolchain
            docker compose up -d tolchain
